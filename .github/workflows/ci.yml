name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build/lint/test do not connect to a database; these are inert placeholders
      # so config that reads env at import time has valid values.
      DATABASE_URL: "mysql://user:pass@localhost:3306/cms"
      AUTH_SECRET: "ci-placeholder-auth-secret-value-change-me"
      DATASOURCE_ENC_KEY: "kpfUrrvqxXPlm3nxDrJ+TMo4iFiJ7VkgdtIkL5sayOE="
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
