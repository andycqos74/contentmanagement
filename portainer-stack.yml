# Portainer stack for the Widget CMS (contentmanagement).
#
# This stack runs a PREBUILT image from GitHub Container Registry (GHCR), built by
# .github/workflows/docker-publish.yml on every push to main. Portainer only PULLS
# the finished image — it does NOT compile the Next.js app on your host. Building
# on the host is memory/CPU heavy and, on a small box, the kernel OOM-killer can
# take down the Docker daemon on redeploy; pulling a prebuilt image avoids that.
#
# ONE-TIME setup so the host can pull the image (pick one):
#   a) Make the GHCR package public (simplest):
#        GitHub -> your avatar -> Packages -> contentmanagement -> Package settings
#        -> Danger Zone -> Change visibility -> Public
#   b) Keep it private and add a registry in Portainer:
#        Portainer -> Registries -> Add registry -> Custom; URL = ghcr.io,
#        username = your GitHub username, password = a PAT with `read:packages`.
#
# Deploy: Portainer -> Stacks -> Add stack -> "Repository"
#   Repository URL : https://github.com/andycqos74/contentmanagement
#   Compose path   : portainer-stack.yml
# Add the environment variables (see .env.portainer.example) in the stack's
# "Environment variables" section and deploy. The web UI is reachable on the host
# at the port set by APP_PORT (default 3000).
#
# To update: wait for the "Publish image" run to go green on the repo's Actions
# tab, then in Portainer redeploy the stack with "Re-pull image" enabled. With no
# build step this is fast and light on the host.
#
# Required: AUTH_SECRET, DATASOURCE_ENC_KEY (see README for how to generate).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cms}
      MYSQL_USER: ${MYSQL_USER:-cms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-db-pw}
    volumes:
      - cms-db:/var/lib/mysql
    # Optional guard rail: cap memory so a spike can't take the host down.
    # mem_limit: ${DB_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-pw}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    # Prebuilt image (published by .github/workflows/docker-publish.yml). To pin a
    # specific build instead of the latest, use e.g. :sha-<short> — see the repo's
    # Packages page for available tags.
    image: ghcr.io/andycqos74/contentmanagement:sha-2e24581
    pull_policy: always
    # Build on the host instead (heavy — can crash small boxes). To use this,
    # comment out the two lines above and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    # Optional guard rail: cap memory so a runaway can't take the host down. The
    # app needs ~300-512MB at runtime; uncomment if your host is small.
    # mem_limit: ${APP_MEM_LIMIT:-768m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-cms}:${MYSQL_PASSWORD:-change-this-db-pw}@db:3306/${MYSQL_DATABASE:-cms}"
      AUTH_SECRET: ${AUTH_SECRET}
      DATASOURCE_ENC_KEY: ${DATASOURCE_ENC_KEY}
      # Public URL the CMS is reached at (used in embed snippets). Optional — if
      # blank it is derived from the request / X-Forwarded-* headers.
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Admin login, created on first start.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme}
      # Optional image storage (github.com/andycqos74/combinedstorage).
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-}
      STORAGE_USERNAME: ${STORAGE_USERNAME:-}
      STORAGE_PASSWORD: ${STORAGE_PASSWORD:-}
      STORAGE_UPLOAD_PARENT: ${STORAGE_UPLOAD_PARENT:-root}
      # Optional: base URL of the public website, used only to preview legacy
      # image paths (/images/...) in the News admin. Defaults to https://www.qosfc.com.
      NEXT_PUBLIC_CONTENT_SITE_URL: ${NEXT_PUBLIC_CONTENT_SITE_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  cms-db:
